
services:

  postgres:
    image: postgres:${POSTGRES_VERSION}
    container_name: cloudflow-postgres
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Executes initial_schema.sql automatically on the first `docker compose up`
      # (only if the PostgreSQL data volume is empty).
      - ../postgres/initial_schema.sql:/docker-entrypoint-initdb.d/initial_schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
        - cloudflow-network

  kafka:
    image: apache/kafka:${KAFKA_VERSION}
    container_name: cloudflow-kafka
    hostname: kafka
    restart: unless-stopped

    env_file:
      - .env

    ports:
      - "${KAFKA_PORT}:9092"

    environment:
      CLUSTER_ID: ${KAFKA_CLUSTER_ID}

      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

      KAFKA_NUM_PARTITIONS: 3

      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"

    volumes:
      - kafka-data:/var/lib/kafka/data

    networks:
      - cloudflow-network

  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:latest
    container_name: cloudflow-kafka-ui
    restart: unless-stopped

    depends_on:
      - kafka

    ports:
      - "${KAFKA_UI_PORT}:8080"

    environment:
      DYNAMIC_CONFIG_ENABLED: "true"
      KAFKA_CLUSTERS_0_NAME: cloudflow-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092

    networks:
      - cloudflow-network

  kafka-topic-init:
    image: apache/kafka:${KAFKA_VERSION}

    container_name: cloudflow-kafka-topic-init

    depends_on:
      kafka:
        condition: service_started

    volumes:
      - ../kafka/create-topics.sh:/create-topics.sh:ro

    entrypoint: ["/bin/bash", "/create-topics.sh"]

    restart: "no"

    networks:
      - cloudflow-network

volumes:
  postgres-data:
  kafka-data:

networks:
    cloudflow-network:
      driver: bridge