
services:
  postgres:
    image: postgres:${POSTGRES_VERSION}
    container_name: cloudflow-postgres
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Executes initial_schema.sql automatically on the first `docker compose up`
      # (only if the PostgreSQL data volume is empty).
      - ../postgres/initial_schema.sql:/docker-entrypoint-initdb.d/initial_schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
        - cloudflow-network

volumes:
  postgres-data:

networks:
    cloudflow-network:
      driver: bridge